name: MD Video Player - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # android/ is not committed (Expo Continuous Native Generation) — generate it from app.json.
      - name: Expo prebuild
        run: pnpm exec expo prebuild --platform android --no-install

      # Release build embeds the JS bundle (a debug APK expects a Metro dev server).
      # Signed with the debug keystore from the Expo template.
      - name: Build APK
        working-directory: android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk MD-Video-Player.apk

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: MD-Video-Player-APK
          path: MD-Video-Player.apk

      # One release per app.json version. Re-builds of the same version replace the APK.
      # Direct link: https://github.com/<owner>/<repo>/releases/latest/download/MD-Video-Player.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" MD-Video-Player.apk --clobber
          else
            gh release create "$TAG" MD-Video-Player.apk \
              --title "MD Video Player $TAG" \
              --notes "Built from ${GITHUB_SHA::7}." \
              --target "$GITHUB_SHA" \
              --latest
          fi
